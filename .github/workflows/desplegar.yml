# Construye la imagen de la Consola y le dice a Railway que la baje.
#
# El build corre acá y no en el servidor a propósito: `next build` pega un pico de
# más de 2 GB, y en un KVM 2 de 8 GB eso compite con Chatwoot y Evolution hasta
# que el kernel mata alguno. El servidor solo baja la imagen ya hecha.

name: Construir y desplegar

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  # Si esto falla, no se construye nada. Es la red que evita subir algo roto.
  verificar:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest

    # Los tests de cupo corren contra Postgres de verdad, no contra mocks: lo
    # que prueban son los locks y las transacciones, que un mock no reproduce.
    # Sin esta base, 35 tests fallan por no poder conectarse.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci
          POSTGRES_DB: crm
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://crm:crm_ci@localhost:5432/crm
      DATABASE_SSL: 'false'
      # Solo para que los módulos que validan el entorno al importarse no
      # revienten. No son secretos: nada de esto sale del contenedor del CI.
      AUTH_SECRET: relleno-de-ci-no-usar-en-produccion-0000000000
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OPS_TIMEZONE: America/Argentina/Catamarca

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `xlsx` viene de cdn.sheetjs.com, no de npm: este paso necesita internet.
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `urlDeTest()` deriva `<base>_test` de DATABASE_URL, así que la base de
      # test tiene que existir y tener el esquema aplicado antes de los tests.
      - name: Preparar la base de tests
        run: |
          PGPASSWORD=crm_ci psql -h localhost -U crm -d crm -c 'create database crm_test'
          DATABASE_URL=postgres://crm:crm_ci@localhost:5432/crm_test npm run db:migrate

      - name: Tests
        run: npm test

  imagen:
    name: Construir imagen
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar al registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché vive en GitHub: sin esto cada build reinstala todo npm.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Imagen con tsx y las dependencias de desarrollo, para correr las
      # migraciones y dar de alta usuarios dentro del servidor.
      - name: Construir imagen de operaciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          push: true
          tags: ${{ env.IMAGEN }}:ops
          cache-from: type=gha

  # Dónde corre esto de verdad: Railway, servicio `ecosystem` del proyecto
  # `ecosystem`, tomando la imagen `:latest` de este mismo registro.
  #
  # Durante un tiempo este paso le avisaba solo a Coolify, y el webhook nunca
  # estuvo cargado. El paso salía en verde diciendo "el despliegue se hace a
  # mano" y nadie lo leía, así que **ningún push llegó a producción**: la imagen
  # se publicaba y Railway seguía sirviendo la de semanas atrás. Un error se
  # daba por arreglado al ver el CI verde y en la app seguía intacto.
  #
  # Por eso ahora, si no hay a quién avisarle, el paso **falla**. Un despliegue
  # que no despliega no puede parecer exitoso.
  desplegar:
    name: Desplegar
    needs: imagen
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Redesplegar en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Falta el secreto RAILWAY_TOKEN: nadie va a bajar la imagen."
            echo "La imagen quedó publicada, pero producción sigue con la versión"
            echo "anterior. Esto falla a propósito: un despliegue que no despliega"
            echo "no puede salir en verde."
            echo
            echo "Se arregla una sola vez:"
            echo "  1. Railway → proyecto ecosystem → Settings → Tokens → crear uno"
            echo "     para el entorno production."
            echo "  2. GitHub → Settings → Secrets and variables → Actions →"
            echo "     New repository secret → nombre RAILWAY_TOKEN."
            exit 1
          fi

          npm install --global @railway/cli

          # El token de proyecto ya trae el proyecto y el entorno adentro; lo
          # único que hay que decirle es qué servicio redesplegar.
          railway redeploy --service ecosystem --yes
          echo "Railway redesplegado con la imagen recién publicada."

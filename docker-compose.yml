services:
  db:
    image: postgres:16-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      # El servidor guarda todo en UTC. La conversión a Catamarca se hace en consulta.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Sin uso hasta la parte 2 (cola de envíos y seguimientos programados con BullMQ).
  # Se levanta desde ahora para que el entorno no cambie cuando llegue el motor de envío.
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:
